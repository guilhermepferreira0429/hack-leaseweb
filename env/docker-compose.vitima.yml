# Destino na VM vítima (Leaseweb): alternativas abertas a S3, RDS e SQS.
# Na VM: docker compose -f docker-compose.vitima.yml --env-file .env up -d
# As portas ficam publicadas no host. Quem decide a exposição à internet é o security group da Leaseweb,
# e é isso que o atacante encontra e a defesa fecha.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?definir em .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?definir em .env}
    volumes:
      - minio:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DESTINO_POSTGRES_PASSWORD:?definir em .env}
      POSTGRES_DB: encomendas
    volumes:
      - postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?definir em .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?definir em .env}

volumes:
  minio:
  postgres:
