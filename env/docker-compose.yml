# Serviços da demo no cérebro (docs/arquitetura.md): "AWS" simulada e destino aberto.
#   LocalStack (S3, SQS, Secrets Manager, SSM, DynamoDB, SNS, CloudWatch Logs) -> a origem
#   Redis-origem           -> faz de ElastiCache (origem)
#   Postgres               -> base de dados da exemplo-app (faz de RDS)
#   MinIO                  -> destino do S3 na Leaseweb
#   Postgres-destino       -> destino do RDS na Leaseweb
#   RabbitMQ               -> destino da fila SQS na Leaseweb
#   Valkey                 -> destino do ElastiCache na Leaseweb
#   OpenBao                -> destino do Secrets Manager e do SSM na Leaseweb (configuração: sessão do migrador)
# Dono deste ficheiro e do env/.env.example: sessão da seed (code/exemplo-app/seed). Pedir-lhe as entradas.
# npm run infra:up   (lê o .env da raiz)
# Tudo ligado só a 127.0.0.1: a única porta aberta de propósito na demo é a da VM vítima.
services:
  localstack:
    # Versão fixa: a partir de 2026 a imagem "latest" exige LOCALSTACK_AUTH_TOKEN (conta paga) e sai logo.
    image: localstack/localstack:4.9
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,sqs,secretsmanager,ssm,dynamodb,sns,logs

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir no .env}
      POSTGRES_DB: encomendas

  # Destino do RDS na Leaseweb (nível B): o migrador copia o esquema e as linhas para aqui.
  # Porta por omissão 5434; POSTGRES_DESTINO_PORTA muda-a se estiver ocupada na máquina.
  postgres-destino:
    image: postgres:16
    ports:
      - "127.0.0.1:${POSTGRES_DESTINO_PORTA:-5434}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_DESTINO_PASSWORD:?definir no .env}
      POSTGRES_DB: encomendas

  minio:
    # minio/minio saiu do Docker Hub (e quay.io pede login); a build da Chainguard é pública e tem o mesmo binário.
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec # RELEASE.2026-11-16T00-11-40Z, testado pelo migrador
    user: "0"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?definir no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?definir no .env}
    volumes:
      - minio:/data

  # Destino da fila SQS na Leaseweb (nível B). Nunca guest/guest: é a credencial de fábrica que o atacante testa.
  rabbitmq:
    image: rabbitmq:4.1.8-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?definir no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?definir no .env}

  # Faz de ElastiCache Redis (a "AWS"): o LocalStack gratuito não tem ElastiCache. Com AUTH, como na AWS.
  redis-origem:
    image: redis:7.4.7
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--requirepass", "${REDIS_ORIGEM_PASSWORD:?definir no .env}"]

  # Destino do ElastiCache na Leaseweb. Nunca sem senha: o atacante testa precisamente isso.
  valkey:
    image: valkey/valkey:8.1.4
    ports:
      - "127.0.0.1:6381:6379"
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?definir no .env}"]

  # Destino dos segredos (Secrets Manager + SSM) na Leaseweb. Modo dev: em memória, perde-se ao reiniciar (chega para a demo).
  openbao:
    image: openbao/openbao:2.7.3
    command: server -dev
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_TOKEN:?definir no .env}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

volumes:
  minio:
